trigger: none

stages:
# ---------- INIT ----------
- stage: Init
  displayName: Terraform Init
  jobs:
  - job: TerraformInit
    pool:
      name: infrapool
    steps:
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: latest

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
        backendServiceArm: yuvaconnection
        backendAzureRmResourceGroupName: frontrg123
        backendAzureRmStorageAccountName: vmstorage1707
        backendAzureRmContainerName: vminerconta
        backendAzureRmKey: pak.terraform.tfstate

# ---------- PLAN ----------
- stage: Plan
  displayName: Terraform Plan
  dependsOn: Init
  condition: succeeded()
  jobs:
  - job: TerraformPlan
    pool:
      name: infrapool
    steps:
    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: azurerm
        command: plan
        workingDirectory: '$(System.DefaultWorkingDirectory)/dev'
        environmentServiceNameAzureRM: yuvaconnection



