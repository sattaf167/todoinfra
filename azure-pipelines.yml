trigger: none

pool:
  name: infrapool

variables:
  TF_VERSION: '1.12.1'
  WORKING_DIR: '$(System.DefaultWorkingDirectory)/dev'

stages:
- stage: Terraform
  displayName: Terraform Infra
  jobs:
  - job: TerraformJob
    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(TF_VERSION)

    - powershell: |
        echo "Current directory:"
        pwd
        echo "Files:"
        dir
      displayName: Verify Path
      workingDirectory: $(WORKING_DIR)

    - powershell: |
        terraform version
      displayName: Terraform Version
      workingDirectory: $(WORKING_DIR)

    - powershell: |
        terraform init
      displayName: Terraform Init
      workingDirectory: $(WORKING_DIR)

    - powershell: |
        terraform plan
      displayName: Terraform Plan
      workingDirectory: $(WORKING_DIR)

    - powershell: |
        terraform apply -auto-approve
      displayName: Terraform Apply
      workingDirectory: $(WORKING_DIR)

      # =======================
# STAGE 2 : DESTROY
# =======================
- stage: TerraformDestroy
  displayName: Terraform Destroy Stage
  dependsOn: TerraformApply
  condition: succeeded()

  jobs:
  - deployment: DestroyJob
    displayName: Terraform Destroy (Manual Approval)
    environment: terraform-destroy-approval   # 👈 approval yahin lagega
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          - powershell: |
              terraform init
            displayName: Terraform Init
            workingDirectory: $(WORKING_DIR)

          - powershell: |
              terraform plan -destroy
            displayName: Terraform Destroy Plan
            workingDirectory: $(WORKING_DIR)

          - powershell: |
              terraform destroy -auto-approve
            displayName: Terraform Destroy
            workingDirectory: $(WORKING_DIR)
